name: Link AI-built PR to build queue

# Fires whenever a pull request is opened, reopened, or updated with new
# commits. We used to also require the branch name to start with
# "claude/", but Claude Code does not always name branches that way (it
# named one "feature/saved-search-alerts" once, which made this whole
# job get skipped). The real, reliable signal that a PR belongs to an
# AI-built issue is the "Closes #N" line in the PR body, which the
# script below already looks for and safely does nothing if it's
# missing -- so we no longer gate on the branch name at all.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Extract linked issue number and update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e

          ISSUE_NUMBER=$(printf '%s' "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No linked issue found in PR body, skipping."
            exit 0
          fi

          echo "Linking PR #$PR_NUMBER to build_queue row for issue #$ISSUE_NUMBER"

          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/build_queue?github_issue_number=eq.$ISSUE_NUMBER" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"github_pr_number\": $PR_NUMBER, \"github_pr_url\": \"$PR_URL\"}"
